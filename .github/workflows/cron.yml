   name: Scheduled Script

   on:
     schedule:
       - cron: '*/15 * * * *'   # every 15 minutes
     workflow_dispatch:          # lets you run it manually with a button

   jobs:
     run-script:
       runs-on: ubuntu-latest
       steps:
         - name: Checkout repo
           uses: actions/checkout@v4

         - name: Run script
           run: |
             chmod +x script.sh
             ./script.sh
